name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract:
    name: Architectural Contract + Safety Guards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -e ".[dev]"
      - name: Run contract tests
        run: pytest tests/test_contract.py -v

  complexity:
    name: Complexity + Line Limits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Check complexity
        run: |
          # No source file may exceed 200 lines
          find src/ -name "*.py" -exec wc -l {} + | awk '$1 > 200 {print "FAIL: " $2 " has " $1 " lines (max 200)"; exit 1}'
          # No function may exceed 40 lines (AST check)
          python scripts/check_complexity.py

  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: |
          pytest tests/ -m "not backtest" -v --tb=short

  backtest:
    name: Backtest + Profitability Gate
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [contract, complexity, tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run backtest on test universe
        run: |
          python -m hanoon_prime.backtest \
            --data-dir data/market_data \
            --tickers AAPL,MSFT,SPY,TSLA,NVDA \
            --output metrics
      - name: Profitability gate
        run: |
          # Fail if ANY ticker shows negative expectancy (0 trades auto-pass)
          python scripts/check_profit_gate.py metrics/

  edge:
    name: Indicator Edge (Permutation Test)
    runs-on: ubuntu-latest
    needs: [contract, complexity, tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run indicator edge tests
        run: |
          pytest tests/test_indicator_edge.py -v --tb=short

  calibrate:
    name: Auto-Calibration Self-Check
    runs-on: ubuntu-latest
    needs: [contract, complexity, tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run auto-calibration
        run: |
          python -m hanoon_prime.calibrate \
            --data-dir data/market_data \
            --output /tmp/calibration.json
      - name: Verify safe-to-activate
        run: |
          python -c "import json; d=json.load(open('/tmp/calibration.json')); assert d['safe_to_activate'], 'Calibration not safe to activate'"
