name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract:
    name: R1-R18 Architectural Contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -e ".[dev]"
          pre-commit install-hooks
      - name: Run contract tests
        run: pytest tests/test_contract.py -v --cov=src/hanoon_prime --cov-report=term --cov-fail-under=80
      - name: Run pre-commit gates (R9-R18 local checks)
        run: |
          python scripts/check_positive_weights.py
          python scripts/check_print.py
          python scripts/check_docstrings.py
          python scripts/check_no_string_dispatch.py
          python scripts/check_no_swallow.py
          python scripts/check_no_todo.py

  type-check:
    name: Type Safety (mypy strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -e ".[dev]"
      - name: Run mypy strict
        run: mypy src/hanoon_prime/

  complexity:
    name: R3 — Complexity + Line Limits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Check complexity
        run: |
          find src/ -name "*.py" -not -name "hands.py" -not -name "validator.py" -not -name "wfa.py" -not -name "ablation.py" -exec wc -l {} + | awk '$1 > 200 {print "FAIL: " $2 " has " $1 " lines (max 200)"; exit 1}'
          python scripts/check_complexity.py

  tests:
    name: Unit Tests (with coverage gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run unit tests
        run: pytest tests/ -m "not backtest" -v --cov=src/hanoon_prime --cov-report=term --cov-fail-under=80

  backtest:
    name: R2 — Backtest Profitability Gate
    runs-on: ubuntu-latest
    needs: [contract, type-check, complexity, tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run backtest on committed fixtures
        run: |
          python -m hanoon_prime.backtest \
            --data-dir data/fixtures \
            --tickers ALL \
            --output metrics
      - name: Profitability gate
        run: |
          python scripts/check_profit_gate.py metrics/

  wf-gate:
    name: R6 — Walk-Forward Anti-Overfit Gate
    runs-on: ubuntu-latest
    needs: [contract, type-check, complexity, tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run WFA on committed fixtures
        run: |
          python scripts/wfa_report.py \
            --data-dir data/fixtures \
            --tickers ALL \
            --output /tmp/phase2_wfa.json

  ablation:
    name: Phase 3 — Ablation Matrix
    runs-on: ubuntu-latest
    needs: [contract, type-check, complexity, tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run ablation matrix on committed fixtures
        run: |
          python scripts/ablation_report.py \
            --data-dir data/fixtures \
            --tickers ALL \
            --output /tmp/phase3_ablation.json
        continue-on-error: true

  edge:
    name: R4 — Indicator Edge (Permutation Test)
    runs-on: ubuntu-latest
    needs: [contract, type-check, complexity, tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run indicator edge tests
        run: pytest tests/test_indicator_edge.py -v --tb=short

  calibrate:
    name: Auto-Calibration Self-Check
    runs-on: ubuntu-latest
    needs: [contract, type-check, complexity, tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run auto-calibration
        run: |
          python -m hanoon_prime.calibrate \
            --data-dir data/fixtures \
            --output /tmp/calibration.json
      - name: Verify safe-to-activate
        run: |
          python -c "import json; d=json.load(open('/tmp/calibration.json')); assert d['safe_to_activate'], 'Calibration not safe to activate'"
