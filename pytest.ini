[pytest]
testpaths = tests
pythonpath = src
addopts = -v --strict-markers --tb=short --cov=src/hanoon_prime --cov-report=term-missing --cov-fail-under=80
markers =
    contract: architectural contract tests (always run in CI)
    backtest: backtest/profitability tests (slow, requires data)
    unit: unit tests for indicators and utilities
    live: tests requiring IB Gateway connection (skipped by default)
filterwarnings =
    error::DeprecationWarning
    error::RuntimeWarning
