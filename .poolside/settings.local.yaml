tools:
    shell:
        allow:
            - git stash *
            - mv *
            - cd *
            - echo *
            - grep *
            - head *
            - git add *
            - pre-commit run *
            - git diff *
            - wc *
            - find *
            - ls *
            - ps aux
            - tail *
            - python3 *
            - curl *
            - cat *
